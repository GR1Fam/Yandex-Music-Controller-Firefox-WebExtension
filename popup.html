<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360">
  <title>Пульт для Яндекс Музыки</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">Пульт для Музыки</span>
      </div>
      <div class="status" id="status" data-state="searching" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text"></span>
      </div>
    </header>

    <section id="view-loading" class="view center">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted" id="loading-text">Подключаемся…</p>
    </section>

    <section id="view-off" class="view center" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
      </div>
      <h1 id="off-title">Яндекс Музыка не подключена</h1>
      <p class="muted" id="off-text"></p>
      <div class="stack">
        <button class="btn-primary" id="btn-open-bg">Запустить в фоне</button>
        <button class="btn-ghost" id="btn-open">Открыть Яндекс Музыку</button>
      </div>
    </section>

    <section id="view-problem" class="view center" hidden>
      <div class="empty-icon warn" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 8v5" /><path d="M12 16.5v.01" /><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
      </div>
      <h1 id="problem-title">Не удалось обнаружить плеер</h1>
      <p class="muted" id="problem-text"></p>
      <div class="row">
        <button class="btn-primary" id="btn-retry">Проверить снова</button>
        <button class="btn-ghost" id="btn-show-tab">Показать вкладку</button>
      </div>
    </section>

    <section id="view-player" class="player" hidden>
      <div class="stage">
        <div class="glow" id="glow"></div>
        <div class="cover" id="cover">
          <svg class="cover-ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
          <img id="cover-img" alt="" hidden>
        </div>
      </div>

      <div class="meta">
        <div class="title" id="title">—</div>
        <div class="artist" id="artist"></div>
        <div class="now" id="now"></div>
      </div>

      <div class="seek" id="seek-wrap">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Позиция в треке">
        <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      </div>

      <div class="controls">
        <button class="ctl" id="btn-prev" aria-label="Предыдущий трек" title="Предыдущий">
          <svg viewBox="0 0 24 24"><path d="M6 5v14" /><path d="M19 5.5v13a.5.5 0 0 1-.8.4L9.3 12.4a.5.5 0 0 1 0-.8l8.9-6.5a.5.5 0 0 1 .8.4Z" class="fill" /></svg>
        </button>
        <button class="ctl play" id="btn-play" aria-label="Играть" title="Играть / Пауза">
          <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1L8.9 4.7a.6.6 0 0 0-.9.5Z" class="fill" /></svg>
          <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1.2" class="fill" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" class="fill" /></svg>
        </button>
        <button class="ctl" id="btn-next" aria-label="Следующий трек" title="Следующий">
          <svg viewBox="0 0 24 24"><path d="M18 5v14" /><path d="M5 5.5v13a.5.5 0 0 0 .8.4l8.9-6.5a.5.5 0 0 0 0-.8L5.8 5.1a.5.5 0 0 0-.8.4Z" class="fill" /></svg>
        </button>
      </div>

      <div class="extras">
        <button class="mini" id="btn-like" aria-label="Нравится" aria-pressed="false" title="Нравится">
          <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.9 3.6 5 6.6 5c1.9 0 3.5 1 5.4 3 1.9-2 3.5-3 5.4-3 3 0 5 2.9 3.8 6.2-1.7 4.7-9.2 9.3-9.2 9.3Z" /></svg>
        </button>
        <button class="mini" id="btn-mute" aria-label="Выключить звук" title="Звук">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" class="fill" /><path id="vol-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path id="vol-x" d="m15.5 9.5 5 5m0-5-5 5" style="display:none" /></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="100" step="1" aria-label="Громкость">
        <button class="mini" id="btn-open-tab" aria-label="Показать вкладку Яндекс Музыки" title="Показать вкладку">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6" /><path d="M20 4 11 13" /><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" /></svg>
        </button>
      </div>
    </section>

    <div id="toast" role="alert" hidden></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
